<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stun-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#160C2B" />
      <stop offset="100%" stop-color="#080411" />
    </linearGradient>
    <linearGradient id="violet-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <radialGradient id="gemini-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#EC4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0" />
    </radialGradient>
    <pattern id="canvas-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1" fill="#8B5CF6" fill-opacity="0.15" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#stun-bg)" />
  <rect width="1200" height="420" fill="url(#gemini-glow)" />
  <rect width="1200" height="420" fill="url(#canvas-grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" />

  <!-- Spatial Thought Canvas Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Connecting Splines -->
    <path d="M -120 -60 C -40 -100 40 40 120 -20" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />
    <path d="M -80 70 C 0 10 60 80 140 60" fill="none" stroke="#EC4899" stroke-width="2" stroke-opacity="0.5" />
    <path d="M -120 -60 C -100 20 -80 40 -80 70" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Isometric Thought Card 1 (Top Left) -->
    <g transform="translate(-120, -70)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#1E1238" stroke="#8B5CF6" stroke-width="1.5" />
      <rect x="-40" y="-18" width="40" height="6" rx="3" fill="#8B5CF6" />
      <rect x="-40" y="-4" width="65" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />
      <rect x="-40" y="6" width="50" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.2" />
    </g>

    <!-- Isometric Thought Card 2 (Bottom Mid) -->
    <g transform="translate(-60, 80)">
      <rect x="-55" y="-32" width="110" height="64" rx="8" fill="#1B0E30" stroke="#EC4899" stroke-width="1.5" />
      <rect x="-45" y="-20" width="50" height="6" rx="3" fill="#EC4899" />
      <rect x="-45" y="-6" width="75" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />
      <rect x="-45" y="6" width="60" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.2" />
    </g>

    <!-- Central Gemini AI Neural Cluster Core -->
    <g transform="translate(50, 10)">
      <circle cx="0" cy="0" r="50" fill="#8B5CF6" fill-opacity="0.15" stroke="#C084FC" stroke-width="2" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="32" fill="#241142" stroke="#EC4899" stroke-width="2" />
      <!-- Gemini Spark Star -->
      <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="url(#violet-pink)" />
    </g>

    <!-- Isometric Thought Card 3 (Right) -->
    <g transform="translate(140, -30)">
      <rect x="-45" y="-28" width="90" height="56" rx="8" fill="#1E1238" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="-35" y="-16" width="35" height="5" rx="2.5" fill="#38BDF8" />
      <rect x="-35" y="-4" width="55" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />
      <rect x="-35" y="6" width="40" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.2" />
    </g>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="200" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#C084FC" />
    <text x="28" y="19" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SPATIAL AI CANVAS</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Stun
    </text>

    <rect x="0" y="105" width="80" height="4" rx="2" fill="url(#violet-pink)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Infinite spatial canvas where Gemini AI navigates, organizes, and transforms thoughts.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Non-linear visual ideation powered by Google Gemini 2.5 Flash and real-time canvas agents.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">CANVAS: REACT FLOW</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">AI: GEMINI 2.5 FLASH</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>